function fresh(){
  return {phase:"start", mode:"link", invitee:false, fromHash:null, players:["",""], filter:"all", era:"all", count:30, deck:[], order:[[],[]], idx:0, likes:[[],[]]};
}
function track(name){ try{ if(window.goatcounter && window.goatcounter.count) window.goatcounter.count({path:name, title:name, event:true}); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.phase){ if(!s.era) s.era="all"; if(!s.mode) s.mode="link"; return s; } return null; }catch(e){ return null; } }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pname(i){ return S.players[i] && S.players[i].trim() ? S.players[i].trim() : (i===0?"Förälder 1":"Förälder 2"); }

const app = document.getElementById("app");

function header(){

}

function render(){
  save();
  if(S.phase==="start") return renderStart();
  if(S.phase==="swipe") return renderSwipe();
  if(S.phase==="handover") return renderHandover();
  if(S.phase==="results") return renderResults();
  if(S.phase==="share") return renderShare();
  if(S.phase==="invited") return renderInvited();
}

function renderStart(){
  const segF = [["all","Alla"],["f","Flicka"],["m","Pojke"],["u","Neutrala"]]

  const segE = [["all","Blandat"],["k","Klassiska"],["n","Moderna"]]
    .map(([v,l])=>`<button class="${S.era===v?"on":""}" onclick="setE('${v}')">${l}</button>`).join("");
  const segC = [[15,"15"],[30,"30"],[999,"Alla"]]
    .map(([v,l])=>`<button class="${S.count===v?"on":""}" onclick="setC(${v})">${l}</button>`).join("");
  const segM = [["link","Var sin telefon"],["same","Samma telefon"]]
    .map(([v,l])=>`<button class="${S.mode===v?"on":""}" onclick="setM('${v}')">${l}</button>`).join("");
  const link = S.mode==="link";
  const inputs = link
    ? `<label class="f">Ditt namn</label><input type="text" id="p0" placeholder="T.ex. Eric" value="${esc(S.players[0])}">`

    ${inputs}
    <label class="f">Vilka namn?</label><div class="seg">${segF}</div>

}
function grabNames(){ const a=document.getElementById("p0"), b=document.getElementById("p1"); if(a) S.players[0]=a.value; if(b) S.players[1]=b.value; }
function setM(v){ grabNames(); S.mode=v; render(); }
function setF(v){ grabNames(); S.filter=v; render(); }
function setE(v){ grabNames(); S.era=v; render(); }
function setC(v){ grabNames(); S.count=v; render(); }
function start(){
  grabNames();
  const pool = NAMES.map((n,i)=>i).filter(i=> (S.filter==="all" || NAMES[i][1]===S.filter) && (S.era==="all" || NAMES[i][4]===S.era));
  if(!pool.length){ document.getElementById("msg").textContent="Inga namn med det urvalet – välj ”Blandat”."; return; }
  S.deck = shuffle(pool).slice(0, S.count);
  S.order = [shuffle(S.deck), shuffle(S.deck)];
  S.likes = [[],[]]; S.player = 0; S.idx = 0; S.phase = "swipe";
  track("start-" + S.mode);
  render();
}

function cardHTML(i, back){
  const n = NAMES[i];
  return `<div class="card ${back?"back":""}" ${back?"":'id="top"'}>
    ${back?"":'<div class="stamp yes" id="sy">JA</div><div class="stamp no" id="sn">NEJ</div>'}
    <div class="tag">${GENDER_LABEL[n[1]]} · ${ERA_LABEL[n[4]]}</div>
    <div class="name">${n[0]}</div>
    <div class="meaning">${n[2]}</div>
    <div class="origin">${n[3]}</div>
  </div>`;
}

function renderSwipe(){
  const order = S.order[S.player], total = order.length;
  const cur = order[S.idx], next = order[S.idx+1];
  app.innerHTML = header() + `
    <div class="who"><b>${esc(pname(S.player))} swipar</b><small>${S.idx+1} / ${total}</small></div>
    <div class="bar"><i style="width:${(S.idx/total)*100}%"></i></div>
    <div class="stage">${next!==undefined?cardHTML(next,true):""}${cardHTML(cur,false)}</div>
    <div class="actions">
      <button class="round no" aria-label="Nej" onclick="decide(false)">✕</button>
      <button class="round yes" aria-label="Ja" onclick="decide(true)">♥</button>
    </div>
    <div class="hint">Swipa höger för ja, vänster för nej</div>`;
  attachDrag();
}

let busy = false;
function decide(yes){
  if(busy) return; busy = true;
  const card = document.getElementById("top");
  const id = S.order[S.player][S.idx];
  if(yes) S.likes[S.player].push(id);
  if(card){
    card.style.transform = `translateX(${yes?520:-520}px) rotate(${yes?24:-24}deg)`;
    card.style.opacity = "0";
    const st = document.getElementById(yes?"sy":"sn"); if(st) st.style.opacity = 1;
  }
  setTimeout(()=>{
    busy = false;
    S.idx++;
    if(S.idx >= S.order[S.player].length){
      if(S.player===0){ S.phase = S.mode==="link" ? "share" : "handover"; if(S.mode==="link") track("lank-skapad"); } else { S.phase="results"; track("resultat-" + S.mode); }
    }
    render();
  }, 260);
}

function attachDrag(){
  const card = document.getElementById("top"); if(!card) return;
  const sy = document.getElementById("sy"), sn = document.getElementById("sn");
  let x0=null, dx=0;
  card.addEventListener("pointerdown", e=>{ x0=e.clientX; dx=0; card.classList.add("drag"); card.setPointerCapture(e.pointerId); });
  card.addEventListener("pointermove", e=>{
    if(x0===null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    sy.style.opacity = Math.max(0, Math.min(1, dx/100));
    sn.style.opacity = Math.max(0, Math.min(1, -dx/100));
  });
  const end = ()=>{
    if(x0===null) return; x0=null; card.classList.remove("drag");
    if(Math.abs(dx) > 90) decide(dx>0);
    else { card.style.transform=""; sy.style.opacity=0; sn.style.opacity=0; }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

  app.innerHTML = header() + `

}

      <li><div><div class="n">${NAMES[i][0]}</div><div class="m">${NAMES[i][2]}</div></div>
      <button class="poster-btn" onclick="openPoster(${i})">Se som tavla</button></li>`).join("")}</ul>`
    : `<div class="empty">Inga gemensamma favoriter den här gången.<br>Testa en ny runda med fler namn!</div>`;
  app.innerHTML = header() + `
    <div style="text-align:center;margin:6px 0 4px"><div class="big-emoji">${matches.length?"💞":"🤷"}</div></div>
    <h2 style="text-align:center">${matches.length} ${matches.length===1?"match":"matchningar"}</h2>
    <p class="lead" style="text-align:center;margin-bottom:6px">${esc(pname(0))} gillade ${S.likes[0].length} · ${esc(pname(1))} gillade ${S.likes[1].length}</p>
    ${list}
    ${S.invitee ? `<div class="box"><b>Skicka matchningarna till ${esc(pname(0))}</b>
      <span class="hint" style="text-align:left;display:block">Hen öppnar länken och ser samma lista.</span>
      <textarea class="linkbox" id="lnk" readonly>${BASE+"#"+makeResult()}</textarea>
      <button class="primary" onclick="copyLink()">Kopiera länk</button><div class="ok" id="ok"></div></div>` : ""}
    <button class="ghost" onclick="again()">${S.mode==="link" ? "Starta en ny runda" : "Ny runda med samma inställningar"}</button>
    <footer>navi.baby</footer>`;
}
function again(){
  if(S.mode!=="link") return start();
  const me = S.invitee ? S.players[1] : S.players[0], fh = S.fromHash;
  S = fresh(); S.players=[me,""]; S.fromHash = fh; clearHash(); render();
}
function restart(){ const fh = location.hash.slice(1) || S.fromHash; S = fresh(); S.fromHash = fh; clearHash(); render(); }
function clearHash(){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }

// ---------- Länkar ----------
function enc(ids){ let v=0n; ids.forEach(i=>{ v |= 1n<<BigInt(i); }); return v.toString(36); }
function dec(s){
  let v=0n; for(const c of s){ const d=parseInt(c,36); if(isNaN(d)) return null; v = v*36n + BigInt(d); }
  const out=[]; for(let i=0;i<NAMES.length;i++){ if((v>>BigInt(i))&1n) out.push(i); } return out;
}
function encName(s){ s=(s||"").trim().slice(0,20); if(!s) return "n";
  return "n"+Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
function decName(s){ try{ const hx=s.slice(1); if(!hx) return "";
  const bytes=new Uint8Array(hx.match(/../g).map(x=>parseInt(x,16))); return new TextDecoder().decode(bytes); }catch(e){ return ""; } }
function makeInvite(){ return ["m1", enc(S.deck), enc(S.likes[0]), encName(S.players[0])].join("-"); }
function makeResult(){ return ["r1", enc(S.deck), enc(S.likes[0]), enc(S.likes[1]), encName(S.players[0]), encName(S.players[1])].join("-"); }

function readHash(){
  const h = location.hash.slice(1);
  if(!h || h===S.fromHash) return;
  const p = h.split("-");
  if(p[0]==="m1" && p.length===4){
    const deck=dec(p[1]), la=dec(p[2]); if(!deck || !deck.length || !la) return;
    S = fresh(); S.mode="link"; S.invitee=true; S.fromHash=h;
    S.deck=deck; S.likes=[la,[]]; S.players=[decName(p[3]),""]; S.phase="invited"; track("inbjudan-oppnad");
  } else if(p[0]==="r1" && p.length===6){
    const deck=dec(p[1]), la=dec(p[2]), lb=dec(p[3]); if(!deck || !la || !lb) return;
    S = fresh(); S.mode="link"; S.fromHash=h;
    S.deck=deck; S.likes=[la,lb]; S.players=[decName(p[4]),decName(p[5])]; S.phase="results";
  }
}

function copyLink(){
  const t=document.getElementById("lnk"), ok=document.getElementById("ok");
  const fallback=()=>{ t.focus(); t.select(); ok.textContent="Håll fingret på texten och välj Kopiera."; };
  try{
    navigator.clipboard.writeText(t.value).then(()=>{ ok.textContent="Kopierad! Klistra in i sms eller WhatsApp."; track("lank-kopierad"); }, fallback);
  }catch(e){ fallback(); }
}

function renderShare(){
  app.innerHTML = header() + `
    <div class="center">
      <div class="big-emoji">💌</div>
      <h2>Klart! Du gillade ${S.likes[0].length} av ${S.deck.length}</h2>
      <p class="lead">Skicka länken till din partner. Hen swipar samma namn utan att se dina svar – sedan visas era gemensamma favoriter.</p>
      <textarea class="linkbox" id="lnk" readonly>${BASE+"#"+makeInvite()}</textarea>
      <button class="primary" onclick="copyLink()">Kopiera länk</button>
      <div class="ok" id="ok"></div>
    </div>`;
}

function renderInvited(){
  const who = esc(pname(0)==="Förälder 1" ? "Din partner" : pname(0));
  app.innerHTML = header() + `
    <div class="center">
      <div class="big-emoji">👶</div>
      <h2>${who} har swipat ${S.deck.length} babynamn</h2>
      <p class="lead">Nu är det din tur. Du ser inte hens svar – bara de namn ni båda gillar.</p>
      <label class="f" style="text-align:left">Ditt namn</label>
      <input type="text" id="p1" placeholder="Namn" value="${esc(S.players[1])}">
      <button class="primary" onclick="acceptInvite()">Börja swipa</button>
    </div>`;
}
function acceptInvite(){
  S.players[1] = document.getElementById("p1").value;
  S.order = [[], shuffle(S.deck)]; S.player = 1; S.idx = 0; S.phase = "swipe"; track("inbjudan-start"); render();
}
window.addEventListener("hashchange", ()=>{ readHash(); render(); });

// ---------- Poster ----------
const PALETTES = [
  {id:"sand",  bg:"#F3EBDF", ink:"#3B3530", accent:"#C9A27E", label:"Sand"},
  {id:"salvia",bg:"#E6EBE2", ink:"#2F3A30", accent:"#8FA58C", label:"Salvia"},
  {id:"rosa",  bg:"#F5E4DF", ink:"#4A3330", accent:"#D98B7A", label:"Rosa"},
  {id:"natt",  bg:"#2E3440", ink:"#F1EBE2", accent:"#C9B48A", label:"Natt"}
];
let posterId = 0, palIdx = 0;
function openPoster(i){ track("tavla-visad"); posterId=i; drawPoster(); document.getElementById("modal").classList.add("open"); }
document.getElementById("closeModal").onclick = ()=>document.getElementById("modal").classList.remove("open");
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") e.currentTarget.classList.remove("open"); });

function branch(color){
  // enkel kvist i linjestil
  let leaves = "";
  const pts = [[150,250,-1],[150,230,1],[150,210,-1],[150,190,1],[150,170,-1],[150,150,1]];
  pts.forEach(([x,y,s],k)=>{
    const lx = x + s*22, ly = y - 10;
    leaves += `<path d="M${x} ${y} Q ${x+s*8} ${y-22} ${lx} ${ly} Q ${x+s*20} ${y+4} ${x} ${y}Z" fill="${color}" opacity="${0.55+k*0.06}"/>`;
  });
  return `<g transform="translate(0,6)"><path d="M150 268 C 150 220, 152 180, 150 138" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round"/>${leaves}
    <circle cx="150" cy="134" r="4" fill="${color}"/></g>`;
}

function drawPoster(){
  const p = PALETTES[palIdx], n = NAMES[posterId];
  const size = n[0].length > 7 ? 46 : 56;
  document.getElementById("poster").innerHTML = `
  <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="400" fill="${p.bg}"/>
    <rect x="14" y="14" width="272" height="372" fill="none" stroke="${p.accent}" stroke-width="1" opacity=".6"/>
    ${branch(p.accent)}
    <text x="150" y="56" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="9" letter-spacing="3" fill="${p.ink}" opacity=".7">${n[3].toUpperCase()}</text>
    <text x="150" y="${size>50?126:120}" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="${size}" fill="${p.ink}" letter-spacing="-1">${n[0]}</text>
    <line x1="130" y1="300" x2="170" y2="300" stroke="${p.accent}" stroke-width="1.5"/>
    <foreignObject x="40" y="310" width="220" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'DM Sans',sans-serif;font-size:11px;line-height:1.45;color:${p.ink};text-align:center;opacity:.85">${n[2].charAt(0).toUpperCase()+n[2].slice(1)}</div>
    </foreignObject>
  </svg>`;
  document.getElementById("swatches").innerHTML = PALETTES.map((q,k)=>
    `<button class="sw ${k===palIdx?"on":""}" style="background:${q.bg};box-shadow:inset 0 0 0 8px ${q.accent}" aria-label="${q.label}" onclick="setPal(${k})"></button>`).join("");
}
function setPal(k){ palIdx=k; drawPoster(); }

readHash();
render();
</script>
</body>
</html>
